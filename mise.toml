# Default tool versions for common multi-language development when this
# directory is mounted at /work (e.g. `task setup` / `task shell` from the
# flavor root). App repos should ship their own mise.toml; this is a starter set.
#
# Inside the image, tools install under MISE_DATA_DIR (/cache/mise).
# `task warm` / `bin/warm` runs `mise install` when this file is present.
#
# Pins live here (node/python/yarn/task) or in the Gemfile (ruby "…"). Do not use
# .tool-versions, .ruby-version, .node-version, or .python-version.
#
# Ruby: Gemfile `ruby "…"` via idiomatic version files (no pin under [tools]
# when mise can parse the version — single-digit segments per component).

min_version = "2025.8.0"

# Project defaults + host identity for docker build/run (see README).
# - .mise.env: committed knobs (POSTGRESQL_VERSION, …)
# - mise-host-env.sh: USER, SHELL, DEV_UID, DEV_GID, IMAGE_USER, TZ (fill gaps only)
[env]
_.file = ".mise.env"
_.source = "./bin/mise-host-env.sh"

[settings]
# Alpine is musl — do not use jdx/ruby precompiled binaries (glibc). Compile
# with ruby-build; the image includes build-base + headers for that.
ruby.compile = true
idiomatic_version_file_enable_tools = ["ruby"]

[tools]
# Node.js 24 — Active LTS (prefer LTS over Current for app work)
node = "24.18.0"
# Yarn classic — still the usual default with yarn.lock / many Rails apps.
# Berry (Yarn 4): `mise use yarn@4` or enable Corepack on Node.
yarn = "1.22.22"
# Python 3.13 — current 3.13 line with broad package support
python = "3.13.14"
# Task (go-task) — host UX in Taskfile.yml; install via mise when this dir is /work
task = "3.52.0"

# Host UX mirrors of Taskfile tasks (same bin/* implementations).
# Prefer: mise build  ≡  task build  ≡  ./bin/build
# Interactive / attach: raw=true (use a real terminal).
# Args: mise run verify -- shells  |  mise shell -- zsh
#       mise run -- mise --version   → use: mise run run -- mise --version
# Not mirrored: Taskfile `default` (list) — use `mise tasks` instead.
# Destructive: cache:reset requires -y or CONFIRM=1 (same as task).

[tasks.config]
description = "Print effective image / volume / project settings"
run = "./bin/config"

[tasks.build]
description = "Build the Docker image (same as task build)"
run = "./bin/build"

[tasks.setup]
description = "Build + cache + warm via docker run path"
run = "./bin/setup"

[tasks.warm]
description = "Best-effort mise + package-manager warm for PROJECT"
run = "./bin/warm"

[tasks.doctor]
description = "Host / Docker / image sanity checks"
run = "./bin/doctor"

[tasks.verify]
description = "Image self-checks (mise run verify -- shells|caches|all)"
run = "./bin/verify"

[tasks.cache]
description = "Create the named Docker volume for /cache"
alias = ["cache:ensure"]
run = "./bin/cache-ensure"

[tasks."cache:reset"]
description = "Delete /cache volume (mise run cache:reset -- -y)"
run = "./bin/cache-reset"

# One-shot in image (name is `run` like Taskfile; invoke: mise run run -- cmd)
[tasks.run]
description = "One-shot via docker run (mise run run -- cmd)"
run = "./bin/run"

[tasks."compose:build"]
description = "Build image via docker compose"
run = "./bin/compose build"

[tasks."compose:config"]
description = "Show resolved compose config"
run = "./bin/compose config"

[tasks."compose:setup"]
description = "Build via compose + warm PROJECT (parallel: setup)"
run = "./bin/compose-setup"

[tasks."compose:down"]
description = "compose down (keeps volumes by default)"
run = "./bin/compose down"

# Pass-through: mise compose -- ps  |  mise compose -- logs -f
[tasks.compose]
description = "Pass-through to bin/compose (mise compose -- <args>)"
raw = true
run = "./bin/compose"

[tasks."compose:run"]
description = "One-shot via compose (mise compose:run -- cmd)"
raw = true
run = "./bin/compose run --rm dev"

# --- Interactive / attach (TTY) — run in a real terminal ---

[tasks.shell]
description = "Interactive shell via docker run (TTY; same as task shell)"
raw = true
run = "./bin/shell"

[tasks."compose:shell"]
description = "Interactive shell via compose run (TTY)"
raw = true
run = "./bin/compose-shell"

[tasks."compose:up"]
description = "compose up (attach to dev; TTY)"
raw = true
run = "./bin/compose up"

[tasks."compose:app"]
description = "Run sample_app Rails via compose (TTY; port 3000)"
raw = true
run = "./bin/compose-app"

