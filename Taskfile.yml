# Host UX for alpine-mise. Requires Task: https://taskfile.dev
# bin/* implements the same commands without Task.
#
# Separate commands (no flag soup on setup):
#   task config          # optional — host values deduced at build
#   task build           # → alpine-mise:dev
#   task warm            # this tree
#   task warm:sample     # sibling alpine-sample (verify warm)
#   task shell
#
# Overrides:
#   IMAGE=my/alpine-mise:dev task build
#   PROJECT=/path/to/app task warm
#   task run -- mise --version

version: "3"

env:
  FLAVOR: alpine-mise
  IMAGE: '{{.IMAGE | default "alpine-mise:dev"}}'
  CACHE_VOLUME: '{{.CACHE_VOLUME | default "cache"}}'
  IMAGE_USER:
    sh: 'printf %s "${IMAGE_USER:-$(id -un 2>/dev/null || echo dev)}"'
  PROJECT:
    sh: 'printf %s "${PROJECT:-{{.USER_WORKING_DIR}}}"'
  DEV_UID:
    sh: 'printf %s "${DEV_UID:-$(id -u)}"'
  DEV_GID:
    sh: 'printf %s "${DEV_GID:-$(id -g)}"'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  config:
    desc: Print deduced image / volume / host identity (no write)
    cmds:
      - ./bin/config

  build:
    desc: Build alpine-mise:dev (host USER/UID/GID as build-args)
    cmds:
      - ./bin/build

  private:sync:
    desc: "github → base-image.env → private GHE → build (docs/PRIVATE-BASE.md)"
    aliases: [private]
    cmds:
      - ./bin/private-sync {{.CLI_ARGS}}

  shell:
    desc: "Interactive shell via docker run (parallel: compose:shell)"
    interactive: true
    cmds:
      - ./bin/shell {{.CLI_ARGS}}

  run:
    desc: "One-shot via docker run (task run -- cmd)"
    cmds:
      - ./bin/run -- {{.CLI_ARGS}}

  setup:
    desc: "Print the split command flow (not a multi-flag installer)"
    cmds:
      - ./bin/setup

  warm:
    desc: Warm volume cache for PROJECT (default this directory)
    cmds:
      - ./bin/warm

  warm:sample:
    desc: Warm sibling alpine-sample (verify warm + cache)
    cmds:
      - ./bin/warm-sample

  cache:ensure:
    desc: Create the named Docker volume for /cache
    aliases: [cache]
    cmds:
      - ./bin/cache-ensure

  cache:reset:
    desc: "Delete /cache volume (task cache:reset -- -y)"
    cmds:
      - ./bin/cache-reset {{.CLI_ARGS}}

  verify:
    desc: "Image self-checks (task verify -- shells|caches|all)"
    cmds:
      - ./bin/verify {{.CLI_ARGS}}

  doctor:
    desc: Host / Docker / image sanity checks
    cmds:
      - ./bin/doctor

  # --- Compose path (parallel to docker run) ---------------------------------

  compose:build:
    desc: Build image via docker compose
    cmds:
      - ./bin/compose build

  compose:shell:
    desc: "Interactive shell via compose run (parallel: shell)"
    interactive: true
    cmds:
      - ./bin/compose-shell {{.CLI_ARGS}}

  compose:run:
    desc: "One-shot via compose (task compose:run -- cmd args)"
    cmds:
      - ./bin/compose run --rm {{.FLAVOR}} {{.CLI_ARGS}}

  compose:up:
    desc: compose up (attach to flavor service)
    interactive: true
    cmds:
      - ./bin/compose up {{.CLI_ARGS}}

  compose:down:
    desc: compose down (keeps volumes by default)
    cmds:
      - ./bin/compose down {{.CLI_ARGS}}

  compose:setup:
    desc: Print compose split-command flow (not a multi-flag installer)
    cmds:
      - ./bin/compose-setup

  compose:config:
    desc: Show resolved compose config
    cmds:
      - ./bin/compose config

  compose:
    desc: Pass-through to bin/compose (task compose -- ps)
    cmds:
      - ./bin/compose {{.CLI_ARGS}}
