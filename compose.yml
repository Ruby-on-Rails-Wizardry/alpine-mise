# Parallel path to bin/shell / task shell (plain docker run).
# Always use: bin/compose …   or  task compose:*
# so .env is generated with host UID/GID and absolute PROJECT_MOUNT.
#
# Images: local-only. Services use the tag produced by bin/build / task build
# (default alpine-mise:dev). pull_policy: never — never fetch that tag from a
# registry. compose build still builds from this repo's Dockerfile when asked.
#
# Service name and hostname match the flavor (alpine-mise).
#
# Examples:
#   bin/build && bin/compose run --rm alpine-mise bash -l
#   bin/compose build                 # local Dockerfile only
#   bin/compose run --rm alpine-mise mise --version
#   PROJECT=/path/to/app bin/compose run --rm alpine-mise bash -l
#   PROJECT=../alpine-sample bin/compose run --rm alpine-mise bash -l

services:
  alpine-mise:
    hostname: alpine-mise
    image: ${IMAGE:-alpine-mise:dev}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER: ${IMAGE_USER:-dev}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        POSTGRESQL_VERSION: ${POSTGRESQL_VERSION:-}
    working_dir: /work
    environment:
      CACHE_ROOT: ${CACHE_ROOT:-/cache}
      # Host zone via bin/compose → .env (override: TZ=…); images ship tzdata
      TZ: ${TZ:-UTC}
    volumes:
      # Project bind (absolute path written by bin/compose into .env)
      - type: bind
        source: ${PROJECT_MOUNT:-.}
        target: /work
        bind:
          create_host_path: true
      # Shared package/tool cache (named volume; flavor-specific default)
      - type: volume
        source: cache
        target: /cache
    stdin_open: true
    tty: true
    # Image ENTRYPOINT ensures /cache ownership; CMD is bash -l

volumes:
  # Named volume shared with bin/shell / bin/cache-ensure (same CACHE_VOLUME).
  # Compose creates it when missing; explicit name avoids project-prefix isolation.
  cache:
    name: ${CACHE_VOLUME:-cache}
